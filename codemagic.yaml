workflows:
  android-release:
    name: Seerah Android release
    max_build_duration: 30
    environment:
      node: 22.14.0
      java: 17
      android_signing:
        - seerah_release_keystore
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Build the web application
        script: npm run build
      - name: Sync web assets with Capacitor
        script: npx cap sync android
      - name: Build signed APK and AAB
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab